&lt;script&gt;

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById(&quot;canvas&quot;);

const ctx =
    canvas.getContext(&quot;2d&quot;);

let W = 0;
let H = 0;

function resize() {

    W =
        canvas.width =
        canvas.clientWidth;

    H =
        canvas.height =
        canvas.clientHeight;
}

window.addEventListener(
    &quot;resize&quot;,
    resize
);

resize();
new ResizeObserver(resize).observe(canvas);


/* =========================================================
   CONTROLS
========================================================= */

const rxSlider =
    document.getElementById(&quot;rx&quot;);

const rySlider =
    document.getElementById(&quot;ry&quot;);

const rzSlider =
    document.getElementById(&quot;rz&quot;);

const densitySlider =
    document.getElementById(&quot;density&quot;);

const rxValue =
    document.getElementById(&quot;rxValue&quot;);

const ryValue =
    document.getElementById(&quot;ryValue&quot;);

const rzValue =
    document.getElementById(&quot;rzValue&quot;);

const densityValue =
    document.getElementById(&quot;densityValue&quot;);


let showWire = true;
let showPoints = true;
let showIDs = false;
let showNeck = true;


/* =========================================================
   MESH
========================================================= */

let N = 15;

let vertices = [];
let originalVertices = [];


/*
    HEAD DIMENSIONS

    The face is centered around Y = 0.

    Bottom of the head is approximately
    Y = -3.

    The neck will begin there.
*/

const HEAD_WIDTH = 5;
const HEAD_HEIGHT = 3;


/* =========================================================
   BUILD HEAD
========================================================= */

function buildMesh() {

    N =
        Number(
            densitySlider.value
        );

    vertices = [];
    originalVertices = [];

    for (
        let j = 0;
        j &lt; N;
        j++
    ) {

        for (
            let i = 0;
            i &lt; N;
            i++
        ) {

            const u =
                i / (N - 1) * 2 - 1;

            const v =
                j / (N - 1) * 2 - 1;


            const distance =
                Math.sqrt(
                    u * u +
                    v * v
                );


            let uu = u;
            let vv = v;


            /*
                Keep the outside of the
                square inside the oval.
            */

            if (distance &gt; 1) {

                uu /= distance;
                vv /= distance;
            }


            const x =
                uu * HEAD_WIDTH;

            const y =
                vv * HEAD_HEIGHT;


            const point = {

                id:
                    vertices.length + 1,

                x: x,
                y: y,
                z: 0
            };


            vertices.push(point);


            originalVertices.push({

                id:
                    point.id,

                x: x,
                y: y,
                z: 0
            });
        }
    }


    densityValue.textContent =
        N + &quot; × &quot; + N;
}


/* =========================================================
   POLYGONAL NECK
========================================================= */

/*
    The neck is deliberately separate from
    the editable face mesh.

    It is a low-poly 3D form.

    Front:
        z = 0.45

    Back:
        z = -0.45
*/


const neckFront = [

    {
        x: -1.55,
        y: -2.55,
        z: 0.45
    },

    {
        x: 1.55,
        y: -2.55,
        z: 0.45
    },

    {
        x: 1.30,
        y: -6.20,
        z: 0.45
    },

    {
        x: -1.30,
        y: -6.20,
        z: 0.45
    }

];


const neckBack = [

    {
        x: -1.55,
        y: -2.55,
        z: -0.45
    },

    {
        x: 1.55,
        y: -2.55,
        z: -0.45
    },

    {
        x: 1.30,
        y: -6.20,
        z: -0.45
    },

    {
        x: -1.30,
        y: -6.20,
        z: -0.45
    }

];


/* =========================================================
   ROTATION
========================================================= */

function rotatePoint(p) {

    let x = p.x;
    let y = p.y;
    let z = p.z;


    const rx =
        Number(rxSlider.value) *
        Math.PI / 180;

    const ry =
        Number(rySlider.value) *
        Math.PI / 180;

    const rz =
        Number(rzSlider.value) *
        Math.PI / 180;


    /* X ROTATION */

    let c =
        Math.cos(rx);

    let s =
        Math.sin(rx);


    let yy =
        y * c -
        z * s;


    let zz =
        y * s +
        z * c;


    y = yy;
    z = zz;


    /* Y ROTATION */

    c =
        Math.cos(ry);

    s =
        Math.sin(ry);


    let xx =
        x * c +
        z * s;


    zz =
        -x * s +
        z * c;


    x = xx;
    z = zz;


    /* Z ROTATION */

    c =
        Math.cos(rz);

    s =
        Math.sin(rz);


    xx =
        x * c -
        y * s;


    yy =
        x * s +
        y * c;


    x = xx;
    y = yy;


    return {

        x: x,
        y: y,
        z: z
    };
}


/* =========================================================
   PROJECTION
========================================================= */

function project(p) {

    const cameraDistance = 22;
    const zoom = Math.min(W / 11.5, H / 10, 76);


    const scale =
        cameraDistance /
        (
            cameraDistance +
            p.z
        );


    return {

        x:
            W / 2 +
            p.x *
            scale *
            zoom,

        y:
            H / 2 -
            p.y *
            scale *
            zoom,

        z:
            p.z
    };
}


/* =========================================================
   SCREEN HEAD VERTICES
========================================================= */

function getScreenVertices() {

    const result = [];


    for (
        let i = 0;
        i &lt; vertices.length;
        i++
    ) {

        const rotated =
            rotatePoint(
                vertices[i]
            );


        const projected =
            project(
                rotated
            );


        projected.id =
            vertices[i].id;


        result.push(
            projected
        );
    }


    return result;
}


/* =========================================================
   SCREEN NECK
========================================================= */

function getScreenNeck() {

    const front = [];
    const back = [];


    for (
        const p of neckFront
    ) {

        front.push(
            project(
                rotatePoint(p)
            )
        );
    }


    for (
        const p of neckBack
    ) {

        back.push(
            project(
                rotatePoint(p)
            )
        );
    }


    return {

        front: front,
        back: back
    };
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {

    ctx.fillStyle =
        &quot;#050810&quot;;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.strokeStyle =
        &quot;#101722&quot;;

    ctx.lineWidth = 1;


    for (
        let x = 0;
        x &lt; W;
        x += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();
    }


    for (
        let y = 0;
        y &lt; H;
        y += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();
    }
}


/* =========================================================
   DRAW POLYGON HELPER
========================================================= */

function polygon(points, fill, stroke) {

    ctx.beginPath();


    ctx.moveTo(
        points[0].x,
        points[0].y
    );


    for (
        let i = 1;
        i &lt; points.length;
        i++
    ) {

        ctx.lineTo(
            points[i].x,
            points[i].y
        );
    }


    ctx.closePath();


    ctx.fillStyle =
        fill;

    ctx.fill();


    if (stroke) {

        ctx.strokeStyle =
            stroke;

        ctx.lineWidth = 1;

        ctx.stroke();
    }
}


/* =========================================================
   DRAW NECK
========================================================= */

function drawNeck() {

    if (!showNeck)
        return;


    const neck =
        getScreenNeck();


    const f =
        neck.front;

    const b =
        neck.back;


    /*
        Back face.
    */

    polygon(
        [
            b[0],
            b[1],
            b[2],
            b[3]
        ],
        &quot;rgba(18,55,78,.95)&quot;,
        &quot;rgba(85,180,220,.55)&quot;
    );


    /*
        Left side.
    */

    polygon(
        [
            f[0],
            b[0],
            b[3],
            f[3]
        ],
        &quot;rgba(17,70,96,.95)&quot;,
        &quot;rgba(85,180,220,.55)&quot;
    );


    /*
        Right side.
    */

    polygon(
        [
            f[1],
            b[1],
            b[2],
            f[2]
        ],
        &quot;rgba(12,53,76,.95)&quot;,
        &quot;rgba(85,180,220,.55)&quot;
    );


    /*
        Bottom.
    */

    polygon(
        [
            f[3],
            b[3],
            b[2],
            f[2]
        ],
        &quot;rgba(10,42,62,.95)&quot;,
        &quot;rgba(85,180,220,.55)&quot;
    );


    /*
        Main front of neck.
    */

    polygon(
        [
            f[0],
            f[1],
            f[2],
            f[3]
        ],
        &quot;rgba(30,105,137,.95)&quot;,
        &quot;rgba(100,205,245,.8)&quot;
    );


    /*
        Add a center polygon so it
        reads as a low-poly object.
    */

    const centerTop = {

        x:
            (f[0].x + f[1].x) / 2,

        y:
            (f[0].y + f[1].y) / 2,

        z:
            (f[0].z + f[1].z) / 2
    };


    const centerBottom = {

        x:
            (f[2].x + f[3].x) / 2,

        y:
            (f[2].y + f[3].y) / 2,

        z:
            (f[2].z + f[3].z) / 2
    };


    ctx.beginPath();

    ctx.moveTo(
        f[0].x,
        f[0].y
    );

    ctx.lineTo(
        centerTop.x,
        centerTop.y
    );

    ctx.lineTo(
        centerBottom.x,
        centerBottom.y
    );

    ctx.lineTo(
        f[3].x,
        f[3].y
    );

    ctx.closePath();

    ctx.fillStyle =
        &quot;rgba(42,125,158,.55)&quot;;

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        centerTop.x,
        centerTop.y
    );

    ctx.lineTo(
        f[1].x,
        f[1].y
    );

    ctx.lineTo(
        f[2].x,
        f[2].y
    );

    ctx.lineTo(
        centerBottom.x,
        centerBottom.y
    );

    ctx.closePath();

    ctx.fillStyle =
        &quot;rgba(24,88,119,.55)&quot;;

    ctx.fill();


    /*
        Neck outline.
    */

    ctx.strokeStyle =
        &quot;rgba(100,205,245,.9)&quot;;

    ctx.lineWidth = 1.5;


    ctx.beginPath();

    ctx.moveTo(
        f[0].x,
        f[0].y
    );

    ctx.lineTo(
        f[1].x,
        f[1].y
    );

    ctx.lineTo(
        f[2].x,
        f[2].y
    );

    ctx.lineTo(
        f[3].x,
        f[3].y
    );

    ctx.closePath();

    ctx.stroke();
}


/* =========================================================
   DRAW FACE
========================================================= */

function drawFace(screenVertices) {

    for (
        let j = 0;
        j &lt; N - 1;
        j++
    ) {

        for (
            let i = 0;
            i &lt; N - 1;
            i++
        ) {

            const a =
                screenVertices[
                    j * N + i
                ];

            const b =
                screenVertices[
                    j * N + i + 1
                ];

            const c =
                screenVertices[
                    (j + 1) * N +
                    i + 1
                ];

            const d =
                screenVertices[
                    (j + 1) * N + i
                ];


            const depth =
                (
                    a.z +
                    b.z +
                    c.z +
                    d.z
                ) / 4;


            const brightness =
                Math.max(
                    0.08,
                    Math.min(
                        0.35,
                        0.20 -
                        depth * 0.008
                    )
                );


            ctx.beginPath();

            ctx.moveTo(
                a.x,
                a.y
            );

            ctx.lineTo(
                b.x,
                b.y
            );

            ctx.lineTo(
                c.x,
                c.y
            );

            ctx.lineTo(
                d.x,
                d.y
            );

            ctx.closePath();


            ctx.fillStyle =
                `rgba(35,150,220,${brightness})`;

            ctx.fill();
        }
    }
}


/* =========================================================
   DRAW MESH
========================================================= */

function drawMesh(screenVertices) {

    if (!showWire)
        return;


    /*
        Horizontal.
    */

    for (
        let j = 0;
        j &lt; N;
        j++
    ) {

        for (
            let i = 0;
            i &lt; N - 1;
            i++
        ) {

            const a =
                screenVertices[
                    j * N + i
                ];

            const b =
                screenVertices[
                    j * N + i + 1
                ];


            drawEdge(
                a,
                b
            );
        }
    }


    /*
        Vertical.
    */

    for (
        let j = 0;
        j &lt; N - 1;
        j++
    ) {

        for (
            let i = 0;
            i &lt; N;
            i++
        ) {

            const a =
                screenVertices[
                    j * N + i
                ];

            const b =
                screenVertices[
                    (j + 1) * N + i
                ];


            drawEdge(
                a,
                b
            );
        }
    }
}


/* =========================================================
   EDGE
========================================================= */

function drawEdge(a,b) {

    ctx.beginPath();

    ctx.moveTo(
        a.x,
        a.y
    );

    ctx.lineTo(
        b.x,
        b.y
    );


    ctx.strokeStyle =
        &quot;rgba(85,195,255,.75)&quot;;

    ctx.lineWidth = 1;

    ctx.stroke();
}


/* =========================================================
   DRAW POINTS
========================================================= */

function drawPoints(screenVertices) {

    if (!showPoints)
        return;


    const order =
        screenVertices
        .map(
            (p,index) =&gt; ({
                p: p,
                index: index
            })
        )
        .sort(
            (a,b) =&gt;
                a.p.z -
                b.p.z
        );


    for (
        const item of order
    ) {

        const p =
            item.p;


        const isSelected =
            item.index ===
            selectedVertex;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            isSelected
                ? 6
                : 4.5,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            isSelected
            ? &quot;#ffffff&quot;
            : &quot;#38aaff&quot;;


        ctx.fill();


        ctx.strokeStyle =
            isSelected
            ? &quot;#55d8ff&quot;
            : &quot;#ffffff&quot;;


        ctx.lineWidth =
            isSelected
            ? 2
            : 1;


        ctx.stroke();
    }
}


/* =========================================================
   DRAW IDS
========================================================= */

function drawVertexIDs(screenVertices) {

    if (!showIDs)
        return;


    const order =
        screenVertices
        .map(
            (p,index) =&gt; ({
                p: p,
                index: index
            })
        )
        .sort(
            (a,b) =&gt;
                a.p.z -
                b.p.z
        );


    for (
        const item of order
    ) {

        const p =
            item.p;


        const isSelected =
            item.index ===
            selectedVertex;


        const text =
            &quot;V&quot; + p.id;


        ctx.font =
            isSelected
            ? &quot;bold 11px Arial&quot;
            : &quot;9px Arial&quot;;


        ctx.textAlign =
            &quot;left&quot;;

        ctx.textBaseline =
            &quot;middle&quot;;


        const offsetX = 8;
        const offsetY = -8;


        const width =
            ctx.measureText(
                text
            ).width;


        ctx.fillStyle =
            &quot;rgba(5,8,16,.75)&quot;;


        ctx.fillRect(
            p.x +
            offsetX -
            2,

            p.y +
            offsetY -
            6,

            width + 4,
            12
        );


        ctx.fillStyle =
            isSelected
            ? &quot;#ffffff&quot;
            : &quot;#8fdcff&quot;;


        ctx.fillText(
            text,

            p.x +
            offsetX,

            p.y +
            offsetY
        );
    }
}


/* =========================================================
   DRAW
========================================================= */

function draw() {

    drawBackground();


    rxValue.textContent =
        rxSlider.value + &quot;°&quot;;

    ryValue.textContent =
        rySlider.value + &quot;°&quot;;

    rzValue.textContent =
        rzSlider.value + &quot;°&quot;;


    /*
        Neck first.

        This puts the neck behind
        the head.
    */

    drawNeck();


    const screenVertices =
        getScreenVertices();


    /*
        Head surface.
    */

    drawFace(
        screenVertices
    );


    /*
        Head mesh.
    */

    drawMesh(
        screenVertices
    );


    /*
        Points.
    */

    drawPoints(
        screenVertices
    );


    /*
        IDs last.
    */

    drawVertexIDs(
        screenVertices
    );
}


/* =========================================================
   FIND CLOSEST VERTEX
========================================================= */

function findVertex(mx,my) {

    const screenVertices =
        getScreenVertices();


    let closest = -1;

    let distance = 16;


    for (
        let i = 0;
        i &lt; screenVertices.length;
        i++
    ) {

        const p =
            screenVertices[i];


        const d =
            Math.hypot(
                mx - p.x,
                my - p.y
            );


        if (
            d &lt; distance
        ) {

            distance = d;
            closest = i;
        }
    }


    return closest;
}


/* =========================================================
   DRAGGING
========================================================= */

let selectedVertex = -1;

let dragging = false;

let startMouseX = 0;
let startMouseY = 0;

let startVertex = null;


const DRAG_SMOOTHING = 1.0;

const Z_DRAG_SCALE = 0.020;


/*
    These are deliberately calculated
    from the camera orientation.

    This fixes the old problem where
    moving LEFT on screen could cause
    the vertex to travel DOWN when
    the head was rotated.
*/

const DRAG_SCALE = 0.018;


let targetX = 0;
let targetY = 0;
let targetZ = 0;


/* =========================================================
   SCREEN MOVEMENT -&gt; WORLD MOVEMENT
========================================================= */

function screenDragToWorld(
    dx,
    dy
) {

    const rz =
        Number(
            rzSlider.value
        ) *
        Math.PI / 180;


    /*
        Screen X axis projected into
        the face&#x27;s local XY plane.
    */

    const worldDX =
        dx * Math.cos(rz) +
        dy * Math.sin(rz);


    const worldDY =
        -dx * Math.sin(rz) +
        dy * Math.cos(rz);


    return {

        x:
            worldDX *
            DRAG_SCALE,

        y:
            -worldDY *
            DRAG_SCALE
    };
}


/* =========================================================
   KEEP POINT INSIDE HEAD
========================================================= */

function constrainToHead(
    x,
    y
) {

    const normalized =
        Math.sqrt(
            (x * x) /
            (HEAD_WIDTH * HEAD_WIDTH)
            +
            (y * y) /
            (HEAD_HEIGHT * HEAD_HEIGHT)
        );


    if (
        normalized &gt; 1
    ) {

        return {

            x:
                x / normalized,

            y:
                y / normalized
        };
    }


    return {

        x: x,
        y: y
    };
}


/* =========================================================
   MOUSE DOWN
========================================================= */

canvas.addEventListener(
    &quot;mousedown&quot;,
    e =&gt; {

        const rect =
            canvas.getBoundingClientRect();


        const mx =
            e.clientX -
            rect.left;


        const my =
            e.clientY -
            rect.top;


        /*
            ALT rotates camera.
        */

        if (
            e.altKey
        ) {

            dragging = true;

            selectedVertex = -2;


            startMouseX =
                e.clientX;

            startMouseY =
                e.clientY;


            canvas.classList.add(
                &quot;dragging&quot;
            );


            return;
        }


        const index =
            findVertex(
                mx,
                my
            );


        if (
            index !== -1
        ) {

            selectedVertex =
                index;


            dragging = true;


            startMouseX =
                e.clientX;

            startMouseY =
                e.clientY;


            startVertex = {

                x:
                    vertices[index].x,

                y:
                    vertices[index].y,

                z:
                    vertices[index].z
            };


            targetX =
                startVertex.x;

            targetY =
                startVertex.y;

            targetZ =
                startVertex.z;


            canvas.classList.add(
                &quot;dragging&quot;
            );


            document.getElementById(
                &quot;status&quot;
            ).textContent =
                e.shiftKey

                ? &quot;V&quot; +
                  vertices[index].id +
                  &quot; — Pulling vertex in 3D&quot;

                : &quot;V&quot; +
                  vertices[index].id +
                  &quot; — Moving vertex&quot;;
        }
    }
);


/* =========================================================
   MOUSE MOVE
========================================================= */

window.addEventListener(
    &quot;mousemove&quot;,
    e =&gt; {

        if (
            !dragging
        )
            return;


        const dx =
            e.clientX -
            startMouseX;


        const dy =
            e.clientY -
            startMouseY;


        /*
            CAMERA ROTATION
        */

        if (
            selectedVertex === -2
        ) {

            let ry =
                Number(
                    rySlider.value
                ) +
                dx * .35;


            let rx =
                Number(
                    rxSlider.value
                ) +
                dy * .35;


            rySlider.value =
                Math.max(
                    -90,
                    Math.min(
                        90,
                        ry
                    )
                );


            rxSlider.value =
                Math.max(
                    -90,
                    Math.min(
                        90,
                        rx
                    )
                );


            return;
        }


        if (
            selectedVertex &lt; 0
        )
            return;


        const v =
            vertices[
                selectedVertex
            ];


        /*
            SHIFT = Z.
        */

        if (
            e.shiftKey
        ) {

            targetZ =
                startVertex.z -
                dy *
                Z_DRAG_SCALE;


            v.z +=
                (
                    targetZ -
                    v.z
                ) *
                DRAG_SMOOTHING;


            return;
        }


        /*
            Normal screen-space drag.
        */

        const movement =
            screenDragToWorld(
                dx,
                dy
            );


        targetX =
            startVertex.x +
            movement.x;


        targetY =
            startVertex.y +
            movement.y;


        const constrained =
            constrainToHead(
                targetX,
                targetY
            );


        targetX =
            constrained.x;

        targetY =
            constrained.y;


        v.x +=
            (
                targetX -
                v.x
            ) *
            DRAG_SMOOTHING;


        v.y +=
            (
                targetY -
                v.y
            ) *
            DRAG_SMOOTHING;
    }
);


/* =========================================================
   MOUSE UP
========================================================= */

window.addEventListener(
    &quot;mouseup&quot;,
    () =&gt; {

        dragging = false;

        selectedVertex = -1;


        canvas.classList.remove(
            &quot;dragging&quot;
        );


        document.getElementById(
            &quot;status&quot;
        ).textContent =
            &quot;Click and drag any point on the face&quot;;
    }
);


/* =========================================================
   TOUCH START
========================================================= */

canvas.addEventListener(
    &quot;touchstart&quot;,
    e =&gt; {

        const t =
            e.touches[0];


        const rect =
            canvas.getBoundingClientRect();


        const mx =
            t.clientX -
            rect.left;


        const my =
            t.clientY -
            rect.top;


        const index =
            findVertex(
                mx,
                my
            );


        if (
            index !== -1
        ) {

            selectedVertex =
                index;


            dragging = true;


            startMouseX =
                t.clientX;

            startMouseY =
                t.clientY;


            startVertex = {

                x:
                    vertices[index].x,

                y:
                    vertices[index].y,

                z:
                    vertices[index].z
            };


            targetX =
                startVertex.x;

            targetY =
                startVertex.y;

            targetZ =
                startVertex.z;


            document.getElementById(
                &quot;status&quot;
            ).textContent =
                &quot;V&quot; +
                vertices[index].id +
                &quot; — Moving vertex&quot;;


            e.preventDefault();
        }
    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH MOVE
========================================================= */

canvas.addEventListener(
    &quot;touchmove&quot;,
    e =&gt; {

        if (
            !dragging ||
            selectedVertex &lt; 0
        )
            return;


        const t =
            e.touches[0];


        const dx =
            t.clientX -
            startMouseX;


        const dy =
            t.clientY -
            startMouseY;


        const v =
            vertices[
                selectedVertex
            ];


        /*
            Two fingers = depth.
        */

        if (
            e.touches.length &gt; 1
        ) {

            targetZ =
                startVertex.z -
                dy *
                Z_DRAG_SCALE;


            v.z +=
                (
                    targetZ -
                    v.z
                ) *
                DRAG_SMOOTHING;


        } else {

            const movement =
                screenDragToWorld(
                    dx,
                    dy
                );


            targetX =
                startVertex.x +
                movement.x;


            targetY =
                startVertex.y +
                movement.y;


            const constrained =
                constrainToHead(
                    targetX,
                    targetY
                );


            targetX =
                constrained.x;

            targetY =
                constrained.y;


            v.x +=
                (
                    targetX -
                    v.x
                ) *
                DRAG_SMOOTHING;


            v.y +=
                (
                    targetY -
                    v.y
                ) *
                DRAG_SMOOTHING;
        }


        e.preventDefault();
    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH END
========================================================= */

canvas.addEventListener(
    &quot;touchend&quot;,
    () =&gt; {

        dragging = false;

        selectedVertex = -1;
    }
);


/* =========================================================
   WIRE BUTTON
========================================================= */

document.getElementById(
    &quot;wire&quot;
).onclick = () =&gt; {

    showWire =
        !showWire;


    document.getElementById(
        &quot;wire&quot;
    ).textContent =
        showWire
        ? &quot;Hide Mesh Lines&quot;
        : &quot;Show Mesh Lines&quot;;
};


/* =========================================================
   POINT BUTTON
========================================================= */

document.getElementById(
    &quot;points&quot;
).onclick = () =&gt; {

    showPoints =
        !showPoints;


    document.getElementById(
        &quot;points&quot;
    ).textContent =
        showPoints
        ? &quot;Hide Points&quot;
        : &quot;Show Points&quot;;
};


/* =========================================================
   IDS BUTTON
========================================================= */

document.getElementById(
    &quot;ids&quot;
).onclick = () =&gt; {

    showIDs =
        !showIDs;


    document.getElementById(
        &quot;ids&quot;
    ).textContent =
        showIDs
        ? &quot;Hide Vertex IDs&quot;
        : &quot;Show Vertex IDs&quot;;
};


/* =========================================================
   NECK BUTTON
========================================================= */

document.getElementById(
    &quot;neck&quot;
).onclick = () =&gt; {

    showNeck =
        !showNeck;


    document.getElementById(
        &quot;neck&quot;
    ).textContent =
        showNeck
        ? &quot;Hide Neck&quot;
        : &quot;Show Neck&quot;;
};


/* =========================================================
   RESET
========================================================= */

document.getElementById(
    &quot;reset&quot;
).onclick = () =&gt; {

    buildMesh();


    rxSlider.value = 0;

    rySlider.value = 0;

    rzSlider.value = 0;


    selectedVertex = -1;

    dragging = false;
};


/* =========================================================
   DENSITY
========================================================= */

densitySlider.addEventListener(
    &quot;input&quot;,
    () =&gt; {

        buildMesh();

        selectedVertex = -1;

        dragging = false;
    }
);


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    draw();

    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   START
========================================================= */

buildMesh();

animate();

&lt;/script&gt;

html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a10;font-family:Arial,sans-serif;color:#eee}

button{background:#111722;color:#eee;border:1px solid #394456;border-radius:6px;padding:8px 11px;cursor:pointer}

const THREAD_TIMER_DURATION=180;
let threadSecondsLeft=THREAD_TIMER_DURATION,threadTimerRunning=false,threadTimerInterval=null,lastTimerTick=0;
function renderThreadTimer(){
 const mins=Math.floor(threadSecondsLeft/60),secs=threadSecondsLeft%60;
 document.getElementById(&amp;quot;threadTime&amp;quot;).textContent=String(mins).padStart(2,&amp;quot;0&amp;quot;)+&amp;quot;:&amp;quot;+String(secs).padStart(2,&amp;quot;0&amp;quot;);
 const progress=document.getElementById(&amp;quot;threadTimerProgress&amp;quot;);
 progress.style.width=(threadSecondsLeft/THREAD_TIMER_DURATION*100)+&amp;quot;%&amp;quot;;
 progress.style.background=threadSecondsLeft&amp;lt;=20?&amp;quot;#ff5364&amp;quot;:&amp;quot;#49b9ff&amp;quot;;
 document.getElementById(&amp;quot;threadTimer&amp;quot;).classList.toggle(&amp;quot;expired&amp;quot;,threadSecondsLeft===0);
 const status=document.getElementById(&amp;quot;threadTimerStatus&amp;quot;);
 status.textContent=threadSecondsLeft===0?&amp;quot;Time complete&amp;quot;:threadTimerRunning?&amp;quot;Session running&amp;quot;:threadSecondsLeft===THREAD_TIMER_DURATION?&amp;quot;Ready&amp;quot;:&amp;quot;Paused&amp;quot;;

}

  const now=Date.now(),elapsed=Math.floor((now-lastTimerTick)/1000);
  if(elapsed&amp;gt;0){threadSecondsLeft=Math.max(0,threadSecondsLeft-elapsed);lastTimerTick+=elapsed*1000;renderThreadTimer()}

}

  const entries = [
    ...words.map((text, i) =&amp;gt; ({text, type: &amp;quot;Main thread&amp;quot;, point: wordPositions[i]})),
    ...leftWords.map((text, i) =&amp;gt; ({text, type: &amp;quot;Association thread&amp;quot;, point: leftWordPositions[i]})),

    ...ladders.flatMap(ladder =&amp;gt; ladder.rungs.map(rung =&amp;gt; ({text: rung.text, type: &amp;quot;Ladder&amp;quot;, point: rung})))
  ];
  const seen = new Set();
  return entries.filter(({text, type, point}) =&amp;gt; {
    const key = type + &amp;quot;|&amp;quot; + text;
    if (!point || seen.has(key) || !text.toLowerCase().includes(query)) return false;
    seen.add(key);
    return true;
  });
};

let words=[&amp;quot;thought&amp;quot;,&amp;quot;idea&amp;quot;,&amp;quot;memory&amp;quot;,&amp;quot;question&amp;quot;,&amp;quot;answer&amp;quot;,&amp;quot;attention&amp;quot;,&amp;quot;language&amp;quot;,&amp;quot;sound&amp;quot;,&amp;quot;meaning&amp;quot;,&amp;quot;action&amp;quot;,&amp;quot;choice&amp;quot;,&amp;quot;reason&amp;quot;,&amp;quot;feeling&amp;quot;,&amp;quot;image&amp;quot;,&amp;quot;story&amp;quot;,&amp;quot;knowledge&amp;quot;,&amp;quot;experience&amp;quot;,&amp;quot;observation&amp;quot;,&amp;quot;possibility&amp;quot;,&amp;quot;direction&amp;quot;,&amp;quot;purpose&amp;quot;,&amp;quot;decision&amp;quot;,&amp;quot;movement&amp;quot;,&amp;quot;connection&amp;quot;,&amp;quot;pattern&amp;quot;,&amp;quot;concept&amp;quot;,&amp;quot;structure&amp;quot;,&amp;quot;expression&amp;quot;,&amp;quot;communication&amp;quot;,&amp;quot;understanding&amp;quot;,&amp;quot;reflection&amp;quot;,&amp;quot;curiosity&amp;quot;,&amp;quot;discovery&amp;quot;,&amp;quot;creation&amp;quot;,&amp;quot;planning&amp;quot;,&amp;quot;problem&amp;quot;,&amp;quot;solution&amp;quot;,&amp;quot;information&amp;quot;,&amp;quot;learning&amp;quot;,&amp;quot;growth&amp;quot;,&amp;quot;change&amp;quot;,&amp;quot;response&amp;quot;,&amp;quot;behavior&amp;quot;,&amp;quot;identity&amp;quot;,&amp;quot;status&amp;quot;,&amp;quot;value&amp;quot;,&amp;quot;emotion&amp;quot;,&amp;quot;intention&amp;quot;,&amp;quot;focus&amp;quot;,&amp;quot;awareness&amp;quot;];
const base=[...words];for(let i=0;i&amp;lt;300;i++)words.push(base[i%base.length]);let leftWords=[...words];

/* SIX MOVABLE STORY BOXES */
let storyBoxes=[],selectedStoryBox=-1;
const STORY_BOX_W=260,STORY_BOX_H=155;
function addSixStoryBoxes(){
 if(storyBoxes.length){selectedStoryBox=0;draw();return}
 const stories=[[&amp;quot;Story 1&amp;quot;,&amp;quot;Beginning: introduce the characters.&amp;quot;],[&amp;quot;Story 2&amp;quot;,&amp;quot;Setting: establish the place and time.&amp;quot;],[&amp;quot;Story 3&amp;quot;,&amp;quot;Conflict: describe the main problem.&amp;quot;],[&amp;quot;Story 4&amp;quot;,&amp;quot;Decision: explain the important choice.&amp;quot;],[&amp;quot;Story 5&amp;quot;,&amp;quot;Action: show what happens next.&amp;quot;],[&amp;quot;Story 6&amp;quot;,&amp;quot;Outcome: record the result.&amp;quot;]];
 const colors=[&amp;quot;#183c5c&amp;quot;,&amp;quot;#49305d&amp;quot;,&amp;quot;#174c43&amp;quot;,&amp;quot;#62451e&amp;quot;,&amp;quot;#56313a&amp;quot;,&amp;quot;#283d54&amp;quot;];
 stories.forEach((s,i)=&amp;gt;storyBoxes.push({label:s[0],text:s[1],x:380+(i%3)*300,y:100+Math.floor(i/3)*205,w:STORY_BOX_W,h:STORY_BOX_H,color:colors[i]}));
 selectedStoryBox=0;document.getElementById(&amp;quot;storyBoxesBtn&amp;quot;).classList.add(&amp;quot;active&amp;quot;);draw();
}
function storyBoxHit(x,y){for(let i=storyBoxes.length-1;i&amp;gt;=0;i--){const b=storyBoxes[i];if(x&amp;gt;=b.x&amp;amp;&amp;amp;x&amp;lt;=b.x+b.w&amp;amp;&amp;amp;y&amp;gt;=b.y&amp;amp;&amp;amp;y&amp;lt;=b.y+b.h)return i}return -1}
function drawStoryBoxes(){
 storyBoxes.forEach((b,i)=&amp;gt;{
  const selected=i===selectedStoryBox;ctx.save();ctx.shadowColor=&amp;quot;#000&amp;quot;;ctx.shadowBlur=selected?18:10;ctx.shadowOffsetX=7;ctx.shadowOffsetY=8;
  ctx.fillStyle=b.color;ctx.strokeStyle=selected?&amp;quot;#fff&amp;quot;:&amp;quot;#8299b5&amp;quot;;ctx.lineWidth=selected?4:2;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,12);ctx.fill();ctx.stroke();
  ctx.shadowColor=&amp;quot;transparent&amp;quot;;ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  ctx.fillStyle=&amp;quot;rgba(0,0,0,.3)&amp;quot;;ctx.beginPath();ctx.roundRect(b.x+3,b.y+3,b.w-6,34,9);ctx.fill();
  ctx.fillStyle=&amp;quot;#fff&amp;quot;;ctx.font=&amp;quot;bold 15px Arial&amp;quot;;ctx.textAlign=&amp;quot;left&amp;quot;;ctx.textBaseline=&amp;quot;middle&amp;quot;;ctx.fillText(b.label,b.x+12,b.y+20,b.w-55);
  ctx.fillStyle=&amp;quot;#b8d9f5&amp;quot;;ctx.font=&amp;quot;11px Arial&amp;quot;;ctx.textAlign=&amp;quot;right&amp;quot;;ctx.fillText(&amp;quot;BOX &amp;quot;+(i+1),b.x+b.w-10,b.y+20);
  ctx.fillStyle=&amp;quot;#e7f1ff&amp;quot;;ctx.font=&amp;quot;13px Arial&amp;quot;;ctx.textAlign=&amp;quot;left&amp;quot;;ctx.textBaseline=&amp;quot;top&amp;quot;;
  const maxWidth=b.w-24;let line=&amp;quot;&amp;quot;,lineY=b.y+51;
  for(const word of b.text.split(/\s+/)){const test=line?line+&amp;quot; &amp;quot;+word:word;if(ctx.measureText(test).width&amp;gt;maxWidth&amp;amp;&amp;amp;line){ctx.fillText(line,b.x+12,lineY);line=word;lineY+=18;if(lineY&amp;gt;b.y+b.h-25)break}else line=test}
  if(line&amp;amp;&amp;amp;lineY&amp;lt;=b.y+b.h-10)ctx.fillText(line,b.x+12,lineY);
  ctx.fillStyle=selected?&amp;quot;#55f2d4&amp;quot;:&amp;quot;#a6b9d1&amp;quot;;ctx.font=&amp;quot;10px Arial&amp;quot;;ctx.textAlign=&amp;quot;right&amp;quot;;ctx.textBaseline=&amp;quot;bottom&amp;quot;;ctx.fillText(&amp;quot;DRAG · DOUBLE-CLICK TO EDIT&amp;quot;,b.x+b.w-9,b.y+b.h-8);ctx.restore();
 });
}
function arrangeStoryBoxes(){if(!storyBoxes.length){addSixStoryBoxes();return}storyBoxes.forEach((b,i)=&amp;gt;{b.x=380+(i%3)*300;b.y=100+Math.floor(i/3)*205});draw()}
function editStoryBox(){const b=storyBoxes[selectedStoryBox];if(!b){alert(&amp;quot;Select a story box first.&amp;quot;);return}const label=prompt(&amp;quot;Story box label:&amp;quot;,b.label);if(label===null)return;const text=prompt(&amp;quot;Story text or details:&amp;quot;,b.text);if(text===null)return;b.label=label.trim()||b.label;b.text=text.trim();draw()}
function moveStoryBoxTo(){const b=storyBoxes[selectedStoryBox];if(!b){alert(&amp;quot;Select a box to move first.&amp;quot;);return}const choice=prompt(&amp;quot;Move &amp;quot;+b.label+&amp;quot; to which box position? Enter 1–&amp;quot;+storyBoxes.length+&amp;quot;:&amp;quot;,String(selectedStoryBox+1));if(choice===null)return;const n=Number(choice)-1;if(!Number.isInteger(n)||n&amp;lt;0||n&amp;gt;=storyBoxes.length){alert(&amp;quot;Choose a box number from 1 to &amp;quot;+storyBoxes.length+&amp;quot;.&amp;quot;);return}const target=storyBoxes[n];if(target===b)return;[b.x,target.x]=[target.x,b.x];[b.y,target.y]=[target.y,b.y];selectedStoryBox=n;draw()}
function bringStoryBoxForward(){if(selectedStoryBox&amp;lt;0)return;const b=storyBoxes.splice(selectedStoryBox,1)[0];storyBoxes.push(b);selectedStoryBox=storyBoxes.length-1;draw()}
function sendStoryBoxBackward(){if(selectedStoryBox&amp;lt;0)return;const b=storyBoxes.splice(selectedStoryBox,1)[0];storyBoxes.unshift(b);selectedStoryBox=0;draw()}
function deleteStoryBox(){if(selectedStoryBox&amp;lt;0)return;storyBoxes.splice(selectedStoryBox,1);selectedStoryBox=Math.min(selectedStoryBox,storyBoxes.length-1);draw()}
function resetStoryBoxes(){storyBoxes=[];selectedStoryBox=-1;draggingStoryBox=-1;document.getElementById(&amp;quot;storyBoxesBtn&amp;quot;).classList.remove(&amp;quot;active&amp;quot;);addSixStoryBoxes()}

function stopThreadTimerInterval(){if(threadTimerInterval!==null){clearInterval(threadTimerInterval);threadTimerInterval=null}}
function startThreadTimer(){
 if(threadTimerRunning||threadSecondsLeft&amp;lt;=0)return;
 threadTimerRunning=true;lastTimerTick=Date.now();stopThreadTimerInterval();
 threadTimerInterval=setInterval(()=&amp;gt;{
  const now=Date.now(),elapsed=Math.floor((now-lastTimerTick)/1000);
  if(elapsed&amp;gt;0){threadSecondsLeft=Math.max(0,threadSecondsLeft-elapsed);lastTimerTick+=elapsed*1000;renderThreadTimer()}
  if(threadSecondsLeft&amp;lt;=0){threadSecondsLeft=0;threadTimerRunning=false;stopThreadTimerInterval();renderThreadTimer();document.getElementById(&amp;quot;threadTimerStatus&amp;quot;).textContent=&amp;quot;Time complete · Your work is preserved&amp;quot;}
 },200);
 renderThreadTimer();
}
function pauseThreadTimer(){threadTimerRunning=false;stopThreadTimerInterval();renderThreadTimer()}
function resetThreadTimer(){threadTimerRunning=false;stopThreadTimerInterval();threadSecondsLeft=THREAD_TIMER_DURATION;renderThreadTimer()}
function restartThreadTimer(){resetThreadTimer();startThreadTimer()}

window.searchThreadMap = query =&amp;gt; {
  const entries = [
    ...words.map((text, i) =&amp;gt; ({text, type: &amp;quot;Main thread&amp;quot;, point: wordPositions[i]})),
    ...leftWords.map((text, i) =&amp;gt; ({text, type: &amp;quot;Association thread&amp;quot;, point: leftWordPositions[i]})),
    ...storyBoxes.map(box =&amp;gt; ({text: box.label + &amp;quot; — &amp;quot; + box.text, type: &amp;quot;Story box&amp;quot;, point: box})),
    ...ladders.flatMap(ladder =&amp;gt; ladder.rungs.map(rung =&amp;gt; ({text: rung.text, type: &amp;quot;Ladder&amp;quot;, point: rung})))
  ];
  const seen = new Set();
  return entries.filter(({text, type, point}) =&amp;gt; {
    const key = type + &amp;quot;|&amp;quot; + text;
    if (!point || seen.has(key) || !text.toLowerCase().includes(query)) return false;
    seen.add(key);
    return true;
  });
};

window.showThreadMatch = ({x, y, width, height, w, h}) =&amp;gt; {
  view.scale = Math.max(view.scale, 1);
  view.x = W / 2 - (x + (width ?? w ?? 0) / 2) * view.scale;
  view.y = H / 2 - (y + (height ?? h ?? 0) / 2) * view.scale;
  draw();
};

const THREAD_TIMER_DURATION=180;
let threadSecondsLeft=THREAD_TIMER_DURATION,threadTimerRunning=false,threadTimerInterval=null,lastTimerTick=0;
function renderThreadTimer(){
 const mins=Math.floor(threadSecondsLeft/60),secs=threadSecondsLeft%60;
 document.getElementById(&amp;quot;threadTime&amp;quot;).textContent=String(mins).padStart(2,&amp;quot;0&amp;quot;)+&amp;quot;:&amp;quot;+String(secs).padStart(2,&amp;quot;0&amp;quot;);
 const progress=document.getElementById(&amp;quot;threadTimerProgress&amp;quot;);
 progress.style.width=(threadSecondsLeft/THREAD_TIMER_DURATION*100)+&amp;quot;%&amp;quot;;
 progress.style.background=threadSecondsLeft&amp;lt;=20?&amp;quot;#ff5364&amp;quot;:&amp;quot;#49b9ff&amp;quot;;
 document.getElementById(&amp;quot;threadTimer&amp;quot;).classList.toggle(&amp;quot;expired&amp;quot;,threadSecondsLeft===0);
 const status=document.getElementById(&amp;quot;threadTimerStatus&amp;quot;);
 status.textContent=threadSecondsLeft===0?&amp;quot;Time complete&amp;quot;:threadTimerRunning?&amp;quot;Session running&amp;quot;:threadSecondsLeft===THREAD_TIMER_DURATION?&amp;quot;Ready&amp;quot;:&amp;quot;Paused&amp;quot;;

  const now=Date.now(),elapsed=Math.floor((now-lastTimerTick)/1000);

}

  const entries = [
    ...words.map((text, i) =&amp;gt; ({text, type: &amp;quot;Main thread&amp;quot;, point: wordPositions[i]})),
    ...leftWords.map((text, i) =&amp;gt; ({text, type: &amp;quot;Association thread&amp;quot;, point: leftWordPositions[i]})),

    ...ladders.flatMap(ladder =&amp;gt; ladder.rungs.map(rung =&amp;gt; ({text: rung.text, type: &amp;quot;Ladder&amp;quot;, point: rung})))
  ];
  const seen = new Set();
  return entries.filter(({text, type, point}) =&amp;gt; {
    const key = type + &amp;quot;|&amp;quot; + text;
    if (!point || seen.has(key) || !text.toLowerCase().includes(query)) return false;
    seen.add(key);
    return true;
  });
};

let words=[&amp;quot;thought&amp;quot;,&amp;quot;idea&amp;quot;,&amp;quot;memory&amp;quot;,&amp;quot;question&amp;quot;,&amp;quot;answer&amp;quot;,&amp;quot;attention&amp;quot;,&amp;quot;language&amp;quot;,&amp;quot;sound&amp;quot;,&amp;quot;meaning&amp;quot;,&amp;quot;action&amp;quot;,&amp;quot;choice&amp;quot;,&amp;quot;reason&amp;quot;,&amp;quot;feeling&amp;quot;,&amp;quot;image&amp;quot;,&amp;quot;story&amp;quot;,&amp;quot;knowledge&amp;quot;,&amp;quot;experience&amp;quot;,&amp;quot;observation&amp;quot;,&amp;quot;possibility&amp;quot;,&amp;quot;direction&amp;quot;,&amp;quot;purpose&amp;quot;,&amp;quot;decision&amp;quot;,&amp;quot;movement&amp;quot;,&amp;quot;connection&amp;quot;,&amp;quot;pattern&amp;quot;,&amp;quot;concept&amp;quot;,&amp;quot;structure&amp;quot;,&amp;quot;expression&amp;quot;,&amp;quot;communication&amp;quot;,&amp;quot;understanding&amp;quot;,&amp;quot;reflection&amp;quot;,&amp;quot;curiosity&amp;quot;,&amp;quot;discovery&amp;quot;,&amp;quot;creation&amp;quot;,&amp;quot;planning&amp;quot;,&amp;quot;problem&amp;quot;,&amp;quot;solution&amp;quot;,&amp;quot;information&amp;quot;,&amp;quot;learning&amp;quot;,&amp;quot;growth&amp;quot;,&amp;quot;change&amp;quot;,&amp;quot;response&amp;quot;,&amp;quot;behavior&amp;quot;,&amp;quot;identity&amp;quot;,&amp;quot;status&amp;quot;,&amp;quot;value&amp;quot;,&amp;quot;emotion&amp;quot;,&amp;quot;intention&amp;quot;,&amp;quot;focus&amp;quot;,&amp;quot;awareness&amp;quot;];
const base=[...words];for(let i=0;i&amp;lt;300;i++)words.push(base[i%base.length]);let leftWords=[...words];

/* SIX MOVABLE STORY BOXES */
let storyBoxes=[],selectedStoryBox=-1;
const STORY_BOX_W=260,STORY_BOX_H=155;
function addSixStoryBoxes(){
 if(storyBoxes.length){selectedStoryBox=0;draw();return}
 const stories=[[&amp;quot;Story 1&amp;quot;,&amp;quot;Beginning: introduce the characters.&amp;quot;],[&amp;quot;Story 2&amp;quot;,&amp;quot;Setting: establish the place and time.&amp;quot;],[&amp;quot;Story 3&amp;quot;,&amp;quot;Conflict: describe the main problem.&amp;quot;],[&amp;quot;Story 4&amp;quot;,&amp;quot;Decision: explain the important choice.&amp;quot;],[&amp;quot;Story 5&amp;quot;,&amp;quot;Action: show what happens next.&amp;quot;],[&amp;quot;Story 6&amp;quot;,&amp;quot;Outcome: record the result.&amp;quot;]];
 const colors=[&amp;quot;#183c5c&amp;quot;,&amp;quot;#49305d&amp;quot;,&amp;quot;#174c43&amp;quot;,&amp;quot;#62451e&amp;quot;,&amp;quot;#56313a&amp;quot;,&amp;quot;#283d54&amp;quot;];
 stories.forEach((s,i)=&amp;gt;storyBoxes.push({label:s[0],text:s[1],x:380+(i%3)*300,y:100+Math.floor(i/3)*205,w:STORY_BOX_W,h:STORY_BOX_H,color:colors[i]}));
 selectedStoryBox=0;document.getElementById(&amp;quot;storyBoxesBtn&amp;quot;).classList.add(&amp;quot;active&amp;quot;);draw();
}
function storyBoxHit(x,y){for(let i=storyBoxes.length-1;i&amp;gt;=0;i--){const b=storyBoxes[i];if(x&amp;gt;=b.x&amp;amp;&amp;amp;x&amp;lt;=b.x+b.w&amp;amp;&amp;amp;y&amp;gt;=b.y&amp;amp;&amp;amp;y&amp;lt;=b.y+b.h)return i}return -1}
function drawStoryBoxes(){
 storyBoxes.forEach((b,i)=&amp;gt;{
  const selected=i===selectedStoryBox;ctx.save();ctx.shadowColor=&amp;quot;#000&amp;quot;;ctx.shadowBlur=selected?18:10;ctx.shadowOffsetX=7;ctx.shadowOffsetY=8;
  ctx.fillStyle=b.color;ctx.strokeStyle=selected?&amp;quot;#fff&amp;quot;:&amp;quot;#8299b5&amp;quot;;ctx.lineWidth=selected?4:2;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,12);ctx.fill();ctx.stroke();
  ctx.shadowColor=&amp;quot;transparent&amp;quot;;ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  ctx.fillStyle=&amp;quot;rgba(0,0,0,.3)&amp;quot;;ctx.beginPath();ctx.roundRect(b.x+3,b.y+3,b.w-6,34,9);ctx.fill();
  ctx.fillStyle=&amp;quot;#fff&amp;quot;;ctx.font=&amp;quot;bold 15px Arial&amp;quot;;ctx.textAlign=&amp;quot;left&amp;quot;;ctx.textBaseline=&amp;quot;middle&amp;quot;;ctx.fillText(b.label,b.x+12,b.y+20,b.w-55);
  ctx.fillStyle=&amp;quot;#b8d9f5&amp;quot;;ctx.font=&amp;quot;11px Arial&amp;quot;;ctx.textAlign=&amp;quot;right&amp;quot;;ctx.fillText(&amp;quot;BOX &amp;quot;+(i+1),b.x+b.w-10,b.y+20);
  ctx.fillStyle=&amp;quot;#e7f1ff&amp;quot;;ctx.font=&amp;quot;13px Arial&amp;quot;;ctx.textAlign=&amp;quot;left&amp;quot;;ctx.textBaseline=&amp;quot;top&amp;quot;;
  const maxWidth=b.w-24;let line=&amp;quot;&amp;quot;,lineY=b.y+51;
  for(const word of b.text.split(/\s+/)){const test=line?line+&amp;quot; &amp;quot;+word:word;if(ctx.measureText(test).width&amp;gt;maxWidth&amp;amp;&amp;amp;line){ctx.fillText(line,b.x+12,lineY);line=word;lineY+=18;if(lineY&amp;gt;b.y+b.h-25)break}else line=test}
  if(line&amp;amp;&amp;amp;lineY&amp;lt;=b.y+b.h-10)ctx.fillText(line,b.x+12,lineY);
  ctx.fillStyle=selected?&amp;quot;#55f2d4&amp;quot;:&amp;quot;#a6b9d1&amp;quot;;ctx.font=&amp;quot;10px Arial&amp;quot;;ctx.textAlign=&amp;quot;right&amp;quot;;ctx.textBaseline=&amp;quot;bottom&amp;quot;;ctx.fillText(&amp;quot;DRAG · DOUBLE-CLICK TO EDIT&amp;quot;,b.x+b.w-9,b.y+b.h-8);ctx.restore();
 });
}
function arrangeStoryBoxes(){if(!storyBoxes.length){addSixStoryBoxes();return}storyBoxes.forEach((b,i)=&amp;gt;{b.x=380+(i%3)*300;b.y=100+Math.floor(i/3)*205});draw()}
function editStoryBox(){const b=storyBoxes[selectedStoryBox];if(!b){alert(&amp;quot;Select a story box first.&amp;quot;);return}const label=prompt(&amp;quot;Story box label:&amp;quot;,b.label);if(label===null)return;const text=prompt(&amp;quot;Story text or details:&amp;quot;,b.text);if(text===null)return;b.label=label.trim()||b.label;b.text=text.trim();draw()}
function moveStoryBoxTo(){const b=storyBoxes[selectedStoryBox];if(!b){alert(&amp;quot;Select a box to move first.&amp;quot;);return}const choice=prompt(&amp;quot;Move &amp;quot;+b.label+&amp;quot; to which box position? Enter 1–&amp;quot;+storyBoxes.length+&amp;quot;:&amp;quot;,String(selectedStoryBox+1));if(choice===null)return;const n=Number(choice)-1;if(!Number.isInteger(n)||n&amp;lt;0||n&amp;gt;=storyBoxes.length){alert(&amp;quot;Choose a box number from 1 to &amp;quot;+storyBoxes.length+&amp;quot;.&amp;quot;);return}const target=storyBoxes[n];if(target===b)return;[b.x,target.x]=[target.x,b.x];[b.y,target.y]=[target.y,b.y];selectedStoryBox=n;draw()}
function bringStoryBoxForward(){if(selectedStoryBox&amp;lt;0)return;const b=storyBoxes.splice(selectedStoryBox,1)[0];storyBoxes.push(b);selectedStoryBox=storyBoxes.length-1;draw()}
function sendStoryBoxBackward(){if(selectedStoryBox&amp;lt;0)return;const b=storyBoxes.splice(selectedStoryBox,1)[0];storyBoxes.unshift(b);selectedStoryBox=0;draw()}
function deleteStoryBox(){if(selectedStoryBox&amp;lt;0)return;storyBoxes.splice(selectedStoryBox,1);selectedStoryBox=Math.min(selectedStoryBox,storyBoxes.length-1);draw()}
function resetStoryBoxes(){storyBoxes=[];selectedStoryBox=-1;draggingStoryBox=-1;document.getElementById(&amp;quot;storyBoxesBtn&amp;quot;).classList.remove(&amp;quot;active&amp;quot;);addSixStoryBoxes()}

function stopThreadTimerInterval(){if(threadTimerInterval!==null){clearInterval(threadTimerInterval);threadTimerInterval=null}}
function startThreadTimer(){
 if(threadTimerRunning||threadSecondsLeft&amp;lt;=0)return;
 threadTimerRunning=true;lastTimerTick=Date.now();stopThreadTimerInterval();
 threadTimerInterval=setInterval(()=&amp;gt;{
  const now=Date.now(),elapsed=Math.floor((now-lastTimerTick)/1000);
  if(elapsed&amp;gt;0){threadSecondsLeft=Math.max(0,threadSecondsLeft-elapsed);lastTimerTick+=elapsed*1000;renderThreadTimer()}
  if(threadSecondsLeft&amp;lt;=0){threadSecondsLeft=0;threadTimerRunning=false;stopThreadTimerInterval();renderThreadTimer();document.getElementById(&amp;quot;threadTimerStatus&amp;quot;).textContent=&amp;quot;Time complete · Your work is preserved&amp;quot;}
 },200);
 renderThreadTimer();
}
function pauseThreadTimer(){threadTimerRunning=false;stopThreadTimerInterval();renderThreadTimer()}
function resetThreadTimer(){threadTimerRunning=false;stopThreadTimerInterval();threadSecondsLeft=THREAD_TIMER_DURATION;renderThreadTimer()}
function restartThreadTimer(){resetThreadTimer();startThreadTimer()}

window.searchThreadMap = query =&amp;gt; {
  const entries = [
    ...words.map((text, i) =&amp;gt; ({text, type: &amp;quot;Main thread&amp;quot;, point: wordPositions[i]})),
    ...leftWords.map((text, i) =&amp;gt; ({text, type: &amp;quot;Association thread&amp;quot;, point: leftWordPositions[i]})),
    ...storyBoxes.map(box =&amp;gt; ({text: box.label + &amp;quot; — &amp;quot; + box.text, type: &amp;quot;Story box&amp;quot;, point: box})),
    ...ladders.flatMap(ladder =&amp;gt; ladder.rungs.map(rung =&amp;gt; ({text: rung.text, type: &amp;quot;Ladder&amp;quot;, point: rung})))
  ];
  const seen = new Set();
  return entries.filter(({text, type, point}) =&amp;gt; {
    const key = type + &amp;quot;|&amp;quot; + text;
    if (!point || seen.has(key) || !text.toLowerCase().includes(query)) return false;
    seen.add(key);
    return true;
  });
};

window.showThreadMatch = ({x, y, width, height, w, h}) =&amp;gt; {
  view.scale = Math.max(view.scale, 1);
  view.x = W / 2 - (x + (width ?? w ?? 0) / 2) * view.scale;
  view.y = H / 2 - (y + (height ?? h ?? 0) / 2) * view.scale;
  draw();
};

<script>

const timing = document.querySelector('.pull-timing');

let timingAnimations = [];

function playPullTiming() {
  timingAnimations.forEach(animation => animation.cancel());
  const midpoint = 500;
  const arrival = 1000;
  const motion = reducedMotion.matches ? 0 : 150;
  timingAnimations = [
    timingSegments[0].animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: midpoint, fill: 'forwards' }),
    timingSegments[1].animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: midpoint, delay: midpoint, fill: 'forwards' }),
    timingWheel.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(90deg)' }], { duration: motion, fill: 'forwards' }),
    timingWeight.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-8px)' }], { duration: motion, delay: arrival, fill: 'forwards' })
  ];
}

document.querySelector('#play-pull').addEventListener('click', playPullTiming);

const wheels = [174, 546];
const colors = ['#ffd087', '#87e2ca'];
let pulls = 0;
let active = -1;
let lastPull = -Infinity;
let targetX = 360;
let targetY = 324;
let x = targetX;
let y = targetY;
const rotation = [0, 0];
const targetRotation = [0, 0];

typing.addEventListener('input', () => {
  active = pulls % 2;
  if (active === 0) playPullTiming();
  pulls += 1;
  lastPull = performance.now();
  targetX = active === 0 ? 304 : 416;
  targetY = 324 - 172 * (1 - Math.exp(-pulls / 28));
  targetRotation[active] += active === 0 ? -0.9 : 0.9;
});

  const ease = reducedMotion.matches ? 1 : 0.17;

  y += (targetY - y) * ease;
  ctx.clearRect(0, 0, 720, 390);
  ctx.strokeStyle = '#23413e';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let column = 24; column < 720; column += 24) {
    ctx.moveTo(column, 0);
    ctx.lineTo(column, 390);
  }
  for (let row = 24; row < 390; row += 24) {
    ctx.moveTo(0, row);
    ctx.lineTo(720, row);
  }
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.font = 'bold 16px system-ui';
  ctx.fillStyle = '#b7cdc7';
  ctx.fillText('↑  FORWARD', 360, 48);

  wheels.forEach((wheelX, index) => {
    rotation[index] += (targetRotation[index] - rotation[index]) * ease;
    const pulling = active === index && now - lastPull < 360;
    const attachment = x + (index === 0 ? -23 : 23);
    const guide = wheelX + (index === 0 ? -34 : 34);
    const tangent = wheelX + (index === 0 ? 24 : -24);
    ctx.strokeStyle = pulling ? colors[index] : '#8aa69f';
    ctx.lineWidth = pulling ? 6 : 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(guide, 160);
    ctx.lineTo(guide, 89);
    ctx.bezierCurveTo(guide, 53, tangent, 50, tangent, 98);
    ctx.lineTo(attachment, y - 19);
    ctx.stroke();

    ctx.save();
    ctx.translate(wheelX, 89);
    ctx.rotate(rotation[index]);
    ctx.fillStyle = '#294b47';
    ctx.strokeStyle = colors[index];
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 0, 27, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    for (let spoke = 0; spoke < 6; spoke += 1) {
      const angle = spoke * Math.PI / 3;
      ctx.beginPath();
      ctx.moveTo(8 * Math.cos(angle), 8 * Math.sin(angle));
      ctx.lineTo(19 * Math.cos(angle), 19 * Math.sin(angle));
      ctx.stroke();
    }
    ctx.fillStyle = colors[index];
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = colors[index];
    ctx.fillText(index === 0 ? 'LEFT' : 'RIGHT', wheelX, 42);
  });

  ctx.fillStyle = '#e4f1ea';
  ctx.beginPath();
  ctx.roundRect(x - 43, y - 20, 86, 40, 8);
  ctx.fill();
  ctx.fillStyle = '#17312e';
  ctx.fillText(loadLabel.value, x, y + 6, 70);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

const wheelPanel = document.querySelector('#wheel-panel').attachShadow({ mode: 'open' });
wheelPanel.append(document.querySelector('#wheel-template').content.cloneNode(true));
{

  const typing = wheelPanel.querySelector("textarea");
  const track = wheelPanel.querySelector(".track");
  const wheel = wheelPanel.querySelector(".wheel");
  const reset = wheelPanel.querySelector("button");
  const direction = wheelPanel.querySelector("select");
  const paths = {
    down: [0.5, 0, 0, 1],
    up: [0.5, 1, 0, -1],
    left: [1, 1, -1, 0],
    right: [0, 1, 1, 0],
  };
  let distance = 0;

  function renderWheel() {
    const radius = wheel.offsetWidth / 2;
    const [startX, startY, stepX, stepY] = paths[direction.value];
    const width = Math.max(0, track.clientWidth - wheel.offsetWidth);
    const height = Math.max(0, track.clientHeight - wheel.offsetHeight);
    const limit = stepX ? width : height;
    distance = Math.min(distance, limit);
    const x = width * startX + distance * stepX;
    const y = height * startY + distance * stepY;
    const rotation = distance * (stepX || stepY) / radius;
    wheel.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}rad)`;
  }

  function advanceWheel() {
    distance += 14;
    renderWheel();
  }

  typing.addEventListener("input", (event) => {
    if (!event.inputType.startsWith("insert")) return;
    advanceWheel();
  });

  reset.addEventListener("click", () => {
    distance = 0;
    renderWheel();
    typing.focus();
  });

  direction.addEventListener("change", () => {
    distance = 0;
    renderWheel();
  });

  renderWheel();
  new ResizeObserver(renderWheel).observe(track);

  const pianoTiming = wheelPanel.querySelector("#piano-timing");
  const sandbag = wheelPanel.querySelector(".sandbag");
  const aKey = wheelPanel.querySelector('[data-note="69"]');
  const dropDuration = 0.24;
  let bagAnimation;
  let audio;

  document.addEventListener("keydown", (event) => {
    if (event.repeat || event.ctrlKey || event.metaKey || event.altKey || event.key.toLowerCase() !== "a") return;
    const target = event.composedPath()[0];
    if (target.matches("input, textarea, select") || target.isContentEditable) return;
    aKey.click();
  });

  function playSandbagThud(impact) {
    const thud = audio.createOscillator();
    const gain = audio.createGain();
    thud.frequency.setValueAtTime(115, impact);
    thud.frequency.exponentialRampToValueAtTime(43, impact + 0.12);
    gain.gain.setValueAtTime(0.001, impact);
    gain.gain.exponentialRampToValueAtTime(0.32, impact + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, impact + 0.2);
    thud.connect(gain).connect(audio.destination);
    thud.start(impact);
    thud.stop(impact + 0.2);
  }

  let lastNoteStart = -Infinity;
  wheelPanel.querySelector(".piano").addEventListener("click", async (event) => {
    const key = event.target.closest(".piano-key");
    if (!key) return;
    const spacing = Number(pianoTiming.value);
    audio ??= new AudioContext();
    await audio.resume();
    const start = Math.max(audio.currentTime, lastNoteStart + spacing);
    lastNoteStart = start;

    const dropsSandbag = key === aKey;
    if (dropsSandbag) playSandbagThud(start + dropDuration);
    const rollForNote = () => {
      if (dropsSandbag) {
        bagAnimation?.cancel();
        sandbag.style.visibility = "visible";
        if (!reducedMotion.matches) {
          bagAnimation = sandbag.animate([
            { transform: "translate(-50%, -43px)", easing: "ease-in" },
            { transform: "translate(-50%, 0)" }
          ], dropDuration * 1000);
        }
      }
      if (direction.value !== "up") {
        direction.value = "up";
        distance = 0;
      }
      advanceWheel();
    };
    const wait = start - audio.currentTime;
    if (wait > 0) {
      setTimeout(rollForNote, wait * 1000);
    } else {
      rollForNote();
    }
    const tone = audio.createOscillator();
    const volume = audio.createGain();
    tone.type = "triangle";
    tone.frequency.value = 440 * 2 ** ((Number(key.dataset.note) - 69) / 12);
    volume.gain.setValueAtTime(0.001, start);
    volume.gain.exponentialRampToValueAtTime(0.16, start + 0.015);
    volume.gain.exponentialRampToValueAtTime(0.001, start + 0.65);
    tone.connect(volume).connect(audio.destination);
    tone.start(start);
    tone.stop(start + 0.65);
  });
}
</script>

<script>
{
  const paragraph = document.querySelector('#face-paragraph');
  const preview = document.querySelector('#face-words');
  const face = document.querySelector('.paragraph-face-preview').textContent;
  const wordSegmenter = typeof Intl.Segmenter === 'function'
    ? new Intl.Segmenter(undefined, { granularity: 'word' })
    : null;

  paragraph.addEventListener('input', () => {
    if (!paragraph.value.trim()) {
      preview.textContent = 'Your words will appear here.';
      return;
    }

    const segments = wordSegmenter
      ? wordSegmenter.segment(paragraph.value)
      : (paragraph.value.match(/\S+|\s+/gu) ?? []).map((segment) => ({
          segment, isWordLike: /[\p{L}\p{N}]/u.test(segment)
        }));
    const content = document.createDocumentFragment();
    for (const { segment, isWordLike } of segments) {
      if (!isWordLike) {
        content.append(segment);
        continue;
      }
      const word = document.createElement('span');
      word.className = 'face-word';
      const icon = document.createElement('span');
      icon.className = 'face-word-icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.textContent = face;
      word.append(icon, segment);
      content.append(word);
    }
    preview.replaceChildren(content);
  });
}
</script>

<script>
{
  const canvas = document.querySelector('#character-canvas');
  const context = canvas.getContext('2d');
  const picture = document.querySelector('#character-picture');
  let referenceUrl;
  let drawingPointer = null;
  let previousPoint;
  context.strokeStyle = '#17312e';
  context.lineWidth = 4;
  context.lineCap = 'round';

  function drawStroke(event) {
    const bounds = canvas.getBoundingClientRect();
    const point = {
      x: (event.clientX - bounds.left) * canvas.width / bounds.width,
      y: (event.clientY - bounds.top) * canvas.height / bounds.height
    };
    const start = previousPoint ?? { x: point.x - 0.1, y: point.y };
    context.beginPath();
    context.moveTo(start.x, start.y);
    context.lineTo(point.x, point.y);
    context.stroke();
    previousPoint = point;
  }

  canvas.addEventListener('pointerdown', event => {
    if (drawingPointer !== null || event.button !== 0) return;
    drawingPointer = event.pointerId;
    previousPoint = null;
    canvas.setPointerCapture(drawingPointer);
    drawStroke(event);
  });
  canvas.addEventListener('pointermove', event => {
    if (event.pointerId === drawingPointer) drawStroke(event);
  });
  canvas.addEventListener('lostpointercapture', event => {
    if (event.pointerId === drawingPointer) drawingPointer = null;
  });

  picture.addEventListener('change', () => {
    const file = picture.files[0];
    if (!file) return;
    if (referenceUrl) URL.revokeObjectURL(referenceUrl);
    referenceUrl = URL.createObjectURL(file);
    canvas.parentElement.querySelector('.drawing-scene').hidden = true;
    canvas.parentElement.style.backgroundImage = 'url("' + referenceUrl + '")';
  });
  document.querySelector('#clear-character').addEventListener('click', () => {
    context.clearRect(0, 0, canvas.width, canvas.height);
  });
}
</script>
